{% extends "base.html" %}

{% block title %}Edit Task{% endblock %}

{% block content %}
<h1>Edit Task</h1>

<form action="{{ url_for('edit_task', task_id=task_id) }}" method="POST">
    <div class="mb-3">
        <label for="title" class="form-label">Task Title</label>
        <input type="text" name="title" id="title" class="form-control" value="{{ task[0] }}" required>
    </div>
    <div class="mb-3">
        <label for="description" class="form-label">Task Description</label>
        <textarea name="description" id="description" class="form-control" required>{{ task[1] }}</textarea>
    </div>
    <div class="mb-3">
        <label for="task_date" class="form-label">Task Date</label>
        <input type="date" name="task_date" id="task_date" class="form-control" value="{{ task[2] }}" required>
    </div>
    <div class="mb-3">
        <label for="priority" class="form-label">Priority</label>
        <select name="priority" id="priority" class="form-select">
            {% for p in priorities %}
                <option value="{{ p }}" {% if p == task[5] %}selected{% endif %}>{{ p }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="mb-3">
        <label for="assignee" class="form-label">Assign To</label>
        <select name="assignee" id="assignee" class="form-select" required>
            <option value="">Select a user or group</option>
            <optgroup label="Users">
                {% for user in users %}
                    <option value="user:{{ user[0] }}" {% if user[0] == task[3] %}selected{% endif %}>
                        {{ user[1] }} ({{ user[2] }})
                    </option>
                {% endfor %}
            </optgroup>
            <optgroup label="Groups">
                {% for group in groups %}
                    <option value="group:{{ group[0] }}" {% if group[0] == task[6] %}selected{% endif %}>
                        {{ group[1] }}
                    </option>
                {% endfor %}
            </optgroup>
        </select>
    </div>
    <div class="mb-3">
        <label for="status" class="form-label">Status</label>
        <select name="status" id="status" class="form-select">
            {% for s in statuses %}
                <option value="{{ s }}" {% if s == task[4] %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Update Task</button>
</form>
{% endblock %}
